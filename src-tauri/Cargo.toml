[package]
name = "omnideck"
version = "0.1.0"
description = "OmniDeck - offline-first church presentation platform"
edition = "2021"
rust-version = "1.77"

# NOTE ON VERIFICATION: this file was written by reading main.rs and
# server.rs directly (they already state their target crate versions in
# comments) rather than scaffolded by `cargo create-tauri-app`, because
# this sandbox has no Rust toolchain to run that generator or `cargo
# check`. Run `cargo check` after this lands and fix whatever the
# compiler flags — most likely spot: tauri's default feature set drifting
# from what current 2.x needs for WebviewWindowBuilder + the path APIs
# used in main.rs.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
